[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmodoro"
version = "1.0.0"
description = "A minimalist CLI focus tracker for deep work using the Flowmodoro technique."
readme = "README.md"
requires-python = ">=3.8"
license = "Unlicense"
authors = [{name = "Your Name"}]

[project.scripts]
flowmodoro = "flowmodoro.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowmodoro*"]

